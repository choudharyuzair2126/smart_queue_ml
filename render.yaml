services:
  - type: web
    name: smartqueue-ml
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python train.py
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ML_API_KEY
        sync: false   # you'll set this in the Render dashboard
      - key: PYTHON_VERSION
        value: 3.11.9        # 👈 pin Python version
